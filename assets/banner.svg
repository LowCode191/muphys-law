<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img"
     aria-label="Murphys Law — a slice of toast that survived the flip and landed butter-side up. Whatever can go wrong, will — once.">
  <rect width="1200" height="300" fill="#ffffff"/>

  <!-- toast: classic two-shoulder slice -->
  <path d="M 116 236
           L 116 172
           C 116 142, 134 122, 156 118
           C 162 98, 188 90, 206 104
           C 216 96, 234 96, 244 104
           C 262 90, 288 98, 294 118
           C 316 122, 334 142, 334 172
           L 334 236
           C 334 244, 328 248, 320 248
           L 130 248
           C 122 248, 116 244, 116 236 Z"
        fill="#FDF3E3" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>

  <!-- butter pat -->
  <g transform="rotate(-5 225 176)">
    <rect x="180" y="150" width="90" height="54" rx="9" fill="#F7C948" stroke="#1a1a1a" stroke-width="8"/>
  </g>
  <path d="M 262 204 C 264 214, 260 222, 252 224" fill="none" stroke="#F7C948" stroke-width="12" stroke-linecap="round"/>
  <path d="M 196 166 l 22 -4" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>

  <!-- ground + landing ticks -->
  <path d="M 80 260 L 370 260" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
  <path d="M 88 230 l -16 -12 M 84 244 l -20 -4" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
  <path d="M 362 230 l 16 -12 M 366 244 l 20 -4" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>

  <!-- caption anchoring the joke -->
  <text x="225" y="288" font-size="20" fill="#8a8a8a" text-anchor="middle" font-family="Menlo, monospace">butter-side up.</text>

  <!-- wordmark + copy -->
  <text x="440" y="128" font-size="78" font-weight="800" letter-spacing="6" fill="#111">MURPHYS LAW</text>
  <text x="442" y="178" font-size="30" fill="#1a1a1a" font-family="Menlo, monospace">Whatever can go wrong, will — once.</text>
  <text x="442" y="220" font-size="20" fill="#8a8a8a" font-family="Menlo, monospace">a lessons-learned register for AI agent fleets —</text>
  <text x="442" y="248" font-size="20" fill="#8a8a8a" font-family="Menlo, monospace">so the toast never lands butter-side down twice.</text>
</svg>
