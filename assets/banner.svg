<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Muphys Law — a hand-drawn slice of toast, landed butter-side up. Whatever can go wrong, will — once.">
  <rect width="1200" height="300" fill="#ffffff"/>

  <!-- ================= hand-drawn toast, butter-side up ================= -->
  <g stroke="#000000" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- ground: one confident ink stroke, uneven weight -->
    <path d="M 96 238 C 150 233, 232 240, 292 236 C 330 234, 372 238, 398 235" stroke-width="9"/>
    <path d="M 118 247 C 160 244, 205 249, 238 246" stroke-width="4" opacity="0.9"/>

    <!-- toast body: classic bread-slice silhouette — two rounded shoulders,
         a dip between, tapered sides, flat-ish bottom. Wobbly, one thick pass. -->
    <path d="M 148 232
             C 141 214, 138 186, 141 160
             C 143 141, 149 124, 162 114
             C 174 105, 189 104, 199 112
             C 205 117, 211 118, 218 114
             C 231 105, 251 104, 264 113
             C 271 118, 277 118, 284 114
             C 297 106, 313 108, 322 120
             C 331 133, 335 152, 334 172
             C 333 196, 329 218, 323 233
             C 322 236, 319 238, 315 238
             C 270 240, 196 240, 154 237
             C 151 237, 149 235, 148 232 Z" stroke-width="12"/>
    <!-- second pass of the pen, slightly off — the sketch look -->
    <path d="M 154 224 C 149 208, 147 184, 150 162" stroke-width="4.5" opacity="0.85"/>
    <path d="M 316 126 C 323 137, 327 152, 327 168" stroke-width="4.5" opacity="0.85"/>

    <!-- butter pat: wobbly slab, clearly sitting on the face -->
    <path d="M 196 166
             C 208 158, 238 156, 262 160
             C 271 162, 275 168, 273 176
             C 271 186, 265 193, 253 195
             C 233 199, 208 197, 197 191
             C 189 186, 186 177, 190 170
             C 192 168, 194 167, 196 166 Z" stroke-width="9"/>
    <!-- melt drip off the butter -->
    <path d="M 252 196 C 253 202, 251 207, 247 209" stroke-width="6"/>
    <!-- butter shine ticks -->
    <path d="M 212 172 C 217 170, 223 169, 228 170" stroke-width="6"/>
    <path d="M 238 180 C 243 179, 248 179, 252 180" stroke-width="6"/>

    <!-- the flip it survived: tumble arc with a scrappy arrowhead -->
    <path d="M 158 84 C 192 58, 256 54, 300 76" stroke-width="8" stroke-dasharray="18 14"/>
    <path d="M 300 76 l -20 -10 M 300 76 l -16 13" stroke-width="8"/>
  </g>

  <!-- ink spatter, like the reference -->
  <g fill="#000000">
    <circle cx="118" cy="120" r="4.5"/>
    <circle cx="104" cy="134" r="2"/>
    <path d="M 344 108 c 4 -2, 8 1, 6 5 c -2 4, -8 3, -8 -1 c 0 -2, 1 -3, 2 -4 Z"/>
    <circle cx="362" cy="196" r="3"/>
    <circle cx="372" cy="184" r="1.6"/>
    <circle cx="86"  cy="196" r="2.4"/>
    <path d="M 140 70 c 3 -3, 7 0, 5 4 c -1 3, -6 2, -6 -1 Z"/>
    <circle cx="312" cy="66" r="2.2"/>
    <circle cx="242" cy="252" r="2"/>
    <circle cx="318" cy="243" r="1.8"/>
    <path d="M 68 158 l 6 -2 l -2 5 Z"/>
    <circle cx="396" cy="140" r="1.7"/>
  </g>

  <!-- ================= wordmark ================= -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#000000">
    <text x="470" y="150" font-size="72" font-weight="700" letter-spacing="3">MUPHYS LAW</text>
    <text x="474" y="196" font-size="24" fill="#000000">Whatever can go wrong, will &#8212; once.</text>
    <text x="474" y="232" font-size="16" fill="#555555">a lessons-learned register for AI agent fleets</text>
  </g>
</svg>
